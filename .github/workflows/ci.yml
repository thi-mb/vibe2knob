name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  hub:
    name: Hub (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e '.[dev]'
      - run: pytest -q

  ui:
    name: UI (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ..
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - name: Generated protocol types are up to date
        run: |
          npm run gen:types
          git diff --exit-code -- src/protocol || {
            echo "::error::The protocol changed. Run 'npm run gen:types' in ui/ and commit the result."
            exit 1
          }
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
