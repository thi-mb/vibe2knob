name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  hub:
    name: Hub (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e '.[dev]'
      - run: pytest -q

  ui:
    name: UI (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ..
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - name: Generated protocol types are up to date
        run: |
          npm run gen:types
          git diff --exit-code -- src/protocol || {
            echo "::error::The protocol changed. Run 'npm run gen:types' in ui/ and commit the result."
            exit 1
          }
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Panel journeys against the fake hub
        run: npm run e2e
        env:
          CI: "1"
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: panel-screenshots
          path: |
            ui/e2e/screenshots/
            ui/e2e/report/
          if-no-files-found: ignore

  package:
    name: Package (pip install)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build the panel UI
        working-directory: ui
        run: npm ci && npm run build
      - run: pip install build && python -m build
      - run: python scripts/check_dist.py dist
      - name: pipx install the wheel, serve the panel, run setup-live
        run: scripts/smoke-install.sh "$(ls "$PWD"/dist/*.whl)[panel]" --python python3.11
