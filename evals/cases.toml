# Advice test cases. Run with: vibe2knob eval
#
# Each case is a real-ish track (fixture) plus a request, and the checks a
# good answer must pass. Every case also gets the standard checks: 2-5 steps,
# stock devices only, consistent with the chain, every step explained, starting
# values given, and an A/B listening tip.
#
#   expect_any_device    at least one step uses one of these devices
#   expect_on_track_any  at least one step works with one of these devices already on the track
#   forbid_devices       no step may use these
#   mention_any          the advice must mention at least one of these words (case-insensitive)
#   why                  what the case is testing, for humans
#
# Fixture paths are relative to this file.

[[case]]
id = "vocal-wider"
fixture = "../fixtures/lead_vocal.json"
request = "make this wider"
why = "A lead vocal is mono and should stay anchored in the centre. Utility Width alone does nothing on a mono source, so good advice widens with effects (delay, chorus, reverb) and keeps the dry voice centred."
expect_any_device = ["Chorus-Ensemble", "Delay", "Echo", "Reverb", "Hybrid Reverb", "Utility"]
mention_any = ["mono", "centre", "center", "middle"]

[[case]]
id = "vocal-upfront"
fixture = "../fixtures/lead_vocal.json"
request = "the vocal feels too far back, bring it more up front"
why = "The chain already has EQ, compression and reverb. A good answer works with them (less reverb, more compression or presence) before adding gear."
expect_on_track_any = ["EQ Eight", "Compressor", "Reverb"]

[[case]]
id = "vocal-muddy"
fixture = "../fixtures/lead_vocal.json"
request = "it sounds a bit muddy"
why = "Mud is fixed by cutting low mids, and EQ Eight is already on the track."
expect_on_track_any = ["EQ Eight"]
mention_any = ["200", "250", "300", "400", "low mid", "low-mid"]

[[case]]
id = "pad-wider"
fixture = "../fixtures/synth_pad.json"
request = "make this wider"
why = "A stereo pad with Chorus-Ensemble and Utility on it. The obvious, correct moves are the Utility width and the chorus already there."
expect_on_track_any = ["Utility", "Chorus-Ensemble", "Wavetable"]
mention_any = ["mono"]

[[case]]
id = "pad-trippier"
fixture = "../fixtures/synth_pad.json"
request = "make it trippier"
why = "Trippy means movement: modulation, sweeps, smeared delays."
expect_any_device = ["Phaser-Flanger", "Echo", "Delay", "Grain Delay", "Auto Filter", "Chorus-Ensemble", "Wavetable", "Auto Pan"]

[[case]]
id = "pad-dreamy"
fixture = "../fixtures/synth_pad.json"
request = "I want this to feel dreamy and washed out"
why = "Long modulated tails and a softened top."
expect_any_device = ["Reverb", "Hybrid Reverb", "Grain Delay", "Echo", "Auto Filter", "Chorus-Ensemble"]

[[case]]
id = "bass-wider"
fixture = "../fixtures/sub_bass.json"
request = "can you make the bass wider?"
why = "The classic trap. Widening sub bass hurts mono playback, so the answer must keep the lows mono (widen only the upper harmonics, or advise against it)."
mention_any = ["mono", "phase", "sub"]

[[case]]
id = "bass-warmer"
fixture = "../fixtures/sub_bass.json"
request = "warmer please"
why = "Saturator is already on the chain at a low drive; turning it up or changing its curve is the natural first move."
expect_on_track_any = ["Saturator", "Operator"]

[[case]]
id = "drums-punchier"
fixture = "../fixtures/drum_group.json"
request = "make the drums punchier"
why = "On a drum group, punch comes from transient shaping and slow-attack compression. The Glue Compressor is already there."
expect_any_device = ["Drum Buss", "Compressor", "Glue Compressor"]
mention_any = ["attack", "transient"]

[[case]]
id = "drums-glue"
fixture = "../fixtures/drum_group.json"
request = "the drums don't feel glued together"
why = "Glue Compressor is on the group but barely working (threshold -6 dB). Adjust it before adding things."
expect_on_track_any = ["Glue Compressor"]

[[case]]
id = "rack-tighter"
fixture = "../fixtures/drum_rack.json"
request = "the beat feels loose, make it tighter"
why = "A Drum Rack with long Simpler decays and a 2.4 s snare reverb inside its chains. The fix is at the source: shorter envelopes and a shorter tail."
expect_on_track_any = ["Simpler", "Reverb", "Drum Rack"]
mention_any = ["decay", "release", "tail"]

[[case]]
id = "plugins-warmer"
fixture = "../fixtures/guitar_plugins.json"
request = "make this warmer"
why = "Real dump from Live: a guitar through Guitar Rig 6 with hidden parameters, then a Tuner. Advice must stay on stock devices and not invent settings for the plugin."
expect_any_device = ["Saturator", "Dynamic Tube", "EQ Eight", "Channel EQ", "Pedal", "Roar"]

[[case]]
id = "unmatched-underwater"
fixture = "../fixtures/synth_pad.json"
request = "make it sound like it's underwater"
why = "No knowledge-map term matches. The model must map it itself (low-pass, slow modulation)."
expect_any_device = ["Auto Filter", "EQ Eight", "Chorus-Ensemble", "Phaser-Flanger", "Wavetable"]
mention_any = ["low-pass", "low pass", "lowpass", "filter"]

[[case]]
id = "acoustic-wider"
fixture = "../fixtures/acoustic_native_fx.json"
request = "make this wider"
why = "Real dump from Live 11: an acoustic guitar with the legacy Chorus, a Compressor, a Reverb and the Ozone Imager 2 plugin, which already widens it. Good advice starts from what is there (chorus delay times, reverb width, the imager) rather than stacking new wideners."
expect_on_track_any = ["Chorus", "Reverb", "Ozone Imager 2"]
mention_any = ["mono"]

[[case]]
id = "labs-dreamier"
fixture = "../fixtures/labs_plugin_instrument.json"
request = "make it dreamier"
why = "Real dump: a MIDI track playing the Spitfire LABS plugin, with its parameters visible as raw 0..1 values. Advice may use its Reverb or Lush Verb knobs, but any added device must be stock."
expect_any_device = ["Reverb", "Hybrid Reverb", "Echo", "Delay", "Grain Delay", "Chorus-Ensemble", "Auto Filter", "LABS (64 Bit)"]

# Chat-path cases. Run with: vibe2knob eval --chat
# (The cases above run on both paths; chat_only cases run only with --chat.)
#
#   session          fixtures that make up the Live set (default: just `fixture`);
#                    every track goes into the light summary
#   fixture          the track selected in Live (full detail); empty for a general chat
#   pinned           tracks pinned with @ (full detail)
#   prior_request, prior_answer, prior_steps
#                    a scripted earlier turn
#   fixture_after    the selected track as the user left it after that turn (the refine diff)
#   expect_no_steps  a prose-only answer is the right one
#   min_steps = 0    steps are optional (a prose-only answer passes too)
#
# Every chat-path answer is also checked for words about what the model is given
# ("summary", "context block"), which the user never sees.

[[case]]
id = "chat-pad-refine"
chat_only = true
fixture = "../fixtures/synth_pad.json"
prior_request = "make this wider"
prior_answer = "The pad is already stereo, so open up the Utility and push the chorus that's already there."
prior_steps = [
  { action = "adjust", device = "Utility", on_track = true, parameter = "Stereo Width", value_range = "120-140 %", explanation = "Raises the side signal so the pad spreads wider around the centre." },
  { action = "adjust", device = "Chorus-Ensemble", on_track = true, parameter = "Mode", value_range = "Ensemble", explanation = "Ensemble uses three modulated voices, which gives a lusher, wider spread." },
]
fixture_after = "fixtures/synth_pad_after_wider.json"
request = "ok it's wider now, but the low end got weaker and kind of phasey"
why = "Refine: the user set Stereo Width to 140 % and the chorus to Ensemble. A good answer notices those exact changes (from the diff) and fixes the lows from there, e.g. Bass Mono or backing the width off, instead of starting over."
expect_on_track_any = ["Utility", "Chorus-Ensemble"]
mention_any = ["140", "Ensemble"]
min_steps = 1

[[case]]
id = "chat-vocal-vs-pad"
chat_only = true
session = ["../fixtures/lead_vocal.json", "../fixtures/sub_bass.json", "../fixtures/synth_pad.json", "../fixtures/drum_group.json"]
fixture = "../fixtures/lead_vocal.json"
request = "the vocal and the pad are fighting each other, how do I make room for the vocal?"
why = "Two tracks: the vocal is selected (full detail), the pad is only in the session summary. A good answer uses the summary to see what's on the pad, works on both, and says it can't see the pad's settings."
expect_any_device = ["EQ Eight", "Utility", "Compressor", "Auto Filter", "Chorus-Ensemble", "Wavetable"]
mention_any = ["Warm Pad", "pad"]

[[case]]
id = "chat-general-question"
chat_only = true
fixture = ""
request = "what's the difference between Echo and Delay in Live?"
why = "A general chat with nothing in context. The answer is an explanation in prose, with no steps."
expect_no_steps = true
mention_any = ["Echo"]

# Arrangement cases: when tracks play.
#
#   plays            Arrangement view, in bars from 1, ends included:
#                    { "<fixture>" = [[first, last], ...] }. Leave it out for a Live link
#                    that reports no arrangement; {} is an arrangement with no clips.
#   locators         [{ name = "Verse", bar = 17 }, ...]

[[case]]
id = "chat-never-overlap"
chat_only = true
session = ["../fixtures/lead_vocal.json", "../fixtures/sub_bass.json", "../fixtures/synth_pad.json", "../fixtures/drum_group.json"]
fixture = "../fixtures/lead_vocal.json"
pinned = ["../fixtures/synth_pad.json"]
plays = { "../fixtures/lead_vocal.json" = [[17, 32], [49, 64]], "../fixtures/synth_pad.json" = [[1, 16], [33, 48], [65, 80]], "../fixtures/sub_bass.json" = [[17, 80]] }
request = "how do these 2 interact?"
why = "The real-world trick question: the vocal and the pad take turns and never play at the same time. A good answer says so, talks about the handover between them, and doesn't prescribe carving EQ room between two tracks that never meet."
expect_no_steps = true
mention_any = ["never", "same time", "at once", "don't overlap", "do not overlap", "take turns", "alternate", "hand off", "handover", "hand over"]

[[case]]
id = "chat-partial-overlap"
chat_only = true
session = ["../fixtures/lead_vocal.json", "../fixtures/sub_bass.json", "../fixtures/synth_pad.json", "../fixtures/drum_group.json"]
fixture = "../fixtures/lead_vocal.json"
pinned = ["../fixtures/synth_pad.json"]
plays = { "../fixtures/lead_vocal.json" = [[17, 32], [49, 80]], "../fixtures/synth_pad.json" = [[1, 16], [33, 48], [65, 80]], "../fixtures/sub_bass.json" = [[17, 80]] }
locators = [{ name = "Intro", bar = 1 }, { name = "Verse", bar = 17 }, { name = "Break", bar = 33 }, { name = "Verse 2", bar = 49 }, { name = "Last chorus", bar = 65 }]
request = "the vocal and the pad are fighting each other, how do I make room for the vocal?"
why = "They only meet in the last chorus (bars 65-80). A good answer still makes room, and says it only matters there, e.g. automating the pad or a cut that only bites in that section."
expect_any_device = ["EQ Eight", "Utility", "Compressor", "Auto Filter", "Chorus-Ensemble", "Wavetable"]
mention_any = ["last chorus", "65"]

[[case]]
id = "chat-full-overlap"
chat_only = true
session = ["../fixtures/lead_vocal.json", "../fixtures/sub_bass.json", "../fixtures/synth_pad.json", "../fixtures/drum_group.json"]
fixture = "../fixtures/lead_vocal.json"
pinned = ["../fixtures/synth_pad.json"]
plays = { "../fixtures/lead_vocal.json" = [[1, 64]], "../fixtures/synth_pad.json" = [[1, 64]], "../fixtures/sub_bass.json" = [[17, 64]] }
request = "the vocal and the pad are fighting each other, how do I make room for the vocal?"
why = "They play together the whole song, so the usual make-room advice is right. Checks that knowing the arrangement doesn't make the answer timid."
expect_any_device = ["EQ Eight", "Utility", "Compressor", "Auto Filter", "Chorus-Ensemble", "Wavetable"]
mention_any = ["pad"]

[[case]]
id = "chat-no-arrangement"
chat_only = true
session = ["../fixtures/lead_vocal.json", "../fixtures/sub_bass.json", "../fixtures/synth_pad.json", "../fixtures/drum_group.json"]
fixture = "../fixtures/lead_vocal.json"
pinned = ["../fixtures/synth_pad.json"]
plays = {}
request = "how do these 2 interact?"
why = "No clips in Arrangement view (they may be in Session view), so the answer can't know whether the two play together. A good answer says so or asks, instead of claiming either way."
expect_no_steps = true
mention_any = ["arrangement", "session view", "same time", "together"]

# Read cases: the model reads tracks it only sees in the summary (read_track).
#
#   expect_reads_any  the model must read at least one of these tracks
#   expect_reads_all  the model must read all of these tracks
#   forbid_reads      the model must not read any of these tracks

[[case]]
id = "chat-reads-low-end"
chat_only = true
session = ["../fixtures/lead_vocal.json", "../fixtures/drum_rack.json", "../fixtures/sub_bass.json", "../fixtures/synth_pad.json", "../fixtures/drum_group.json"]
fixture = "../fixtures/lead_vocal.json"
request = "the low end is muddy"
why = "Only the vocal is selected, but the low end lives in the kick and the bass. A good answer reads them (Beat, Sub Bass or the drum group) before it advises, instead of EQing the vocal or guessing their settings."
expect_reads_any = ["Sub Bass", "Beat", "Drums"]
min_steps = 1

[[case]]
id = "chat-no-read-wider"
chat_only = true
session = ["../fixtures/synth_pad.json", "../fixtures/lead_vocal.json", "../fixtures/sub_bass.json", "../fixtures/drum_group.json"]
fixture = "../fixtures/synth_pad.json"
request = "make this wider"
why = "Widening the selected pad needs nothing but the pad, which already has full detail. Reading other tracks would spend time and tokens for nothing."
forbid_reads = ["Lead Vox", "Sub Bass", "Drums"]
expect_on_track_any = ["Utility", "Chorus-Ensemble", "Wavetable"]

[[case]]
id = "chat-reads-both-clash"
chat_only = true
session = ["../fixtures/drum_group.json", "../fixtures/sub_bass.json", "../fixtures/acoustic_native_fx.json", "../fixtures/lead_vocal.json"]
fixture = "../fixtures/drum_group.json"
request = "does the guitar clash with the vocal?"
why = "Neither the guitar (acoustic-pick) nor the vocal is in context; the drums are selected. A good answer reads both before judging, and resolves \"the guitar\" to acoustic-pick from the summary."
expect_reads_all = ["acoustic-pick", "Lead Vox"]
min_steps = 0

# Session view cases: the clip grid and what plays from it.
#
#   scenes           Session view clips, scenes numbered from 1:
#                    { "<fixture>" = [1, 3] }. Leave it out for a Live link that reports
#                    no Session view; {} is a grid with no clips.
#   scene_names      ["Intro", "Verse", ...]
#   playing          what plays now: { "<fixture>" = 3 } (the transport is playing when set)

[[case]]
id = "chat-scene-overlap"
chat_only = true
session = ["../fixtures/lead_vocal.json", "../fixtures/sub_bass.json", "../fixtures/synth_pad.json", "../fixtures/drum_group.json"]
fixture = "../fixtures/lead_vocal.json"
pinned = ["../fixtures/synth_pad.json"]
scenes = { "../fixtures/lead_vocal.json" = [2, 3, 5], "../fixtures/synth_pad.json" = [1, 3, 4], "../fixtures/sub_bass.json" = [2, 3, 4, 5] }
scene_names = ["Intro", "Verse", "Chorus", "Break", "Verse 2"]
request = "the vocal and the pad are fighting each other, how do I make room for the vocal?"
why = "A Session view set with no arrangement: the vocal and the pad only share the Chorus scene. A good answer still makes room, and says it only matters in the Chorus (e.g. a cut or automation that only bites there)."
expect_any_device = ["EQ Eight", "Utility", "Compressor", "Auto Filter", "Chorus-Ensemble", "Wavetable"]
mention_any = ["Chorus", "scene 3"]

[[case]]
id = "chat-playing-now"
chat_only = true
session = ["../fixtures/lead_vocal.json", "../fixtures/sub_bass.json", "../fixtures/synth_pad.json", "../fixtures/drum_group.json"]
fixture = "../fixtures/synth_pad.json"
scenes = { "../fixtures/synth_pad.json" = [1, 3], "../fixtures/lead_vocal.json" = [2], "../fixtures/sub_bass.json" = [2, 3], "../fixtures/drum_group.json" = [2, 3] }
scene_names = ["Intro", "Verse", "Drop"]
playing = { "../fixtures/synth_pad.json" = 3, "../fixtures/sub_bass.json" = 3 }
request = "it sounds muddy right now, what should I do?"
why = "The Drop scene is playing: the selected pad with the sub bass (the vocal isn't playing). A good answer goes by what plays now, points at the pad and the sub bass sharing the low end, and doesn't blame the vocal."
expect_any_device = ["EQ Eight", "Utility", "Auto Filter", "Channel EQ", "Wavetable", "Operator", "Saturator"]
mention_any = ["Sub Bass", "Drop"]
min_steps = 1

[[case]]
id = "chat-arrangement-only"
chat_only = true
session = ["../fixtures/lead_vocal.json", "../fixtures/sub_bass.json", "../fixtures/synth_pad.json", "../fixtures/drum_group.json"]
fixture = "../fixtures/lead_vocal.json"
pinned = ["../fixtures/synth_pad.json"]
plays = { "../fixtures/lead_vocal.json" = [[17, 32], [49, 64]], "../fixtures/synth_pad.json" = [[1, 16], [33, 48], [65, 80]], "../fixtures/sub_bass.json" = [[17, 80]] }
scenes = {}
scene_names = ["", "", "", "", "", "", "", ""]
request = "how do these 2 interact?"
why = "Like chat-never-overlap, but the Live link also reports an empty Session view (8 empty scenes). No Session view part goes to the model, and the answer still says the two never play at the same time."
expect_no_steps = true
mention_any = ["never", "same time", "at once", "don't overlap", "do not overlap", "take turns", "alternate", "hand off", "handover", "hand over"]

# Range cases: the model reads a part of the song or a scene with read_arrangement or
# read_scenes, because the context names only some of who plays there.
#
#   expect_tools     read tools the model must call

[[case]]
id = "chat-range-drop"
chat_only = true
session = ["../fixtures/lead_vocal.json", "../fixtures/sub_bass.json", "../fixtures/synth_pad.json", "../fixtures/guitar_plugins.json", "../fixtures/drum_group.json", "../fixtures/drum_rack.json"]
fixture = "../fixtures/drum_rack.json"
plays = { "../fixtures/lead_vocal.json" = [[9, 24], [45, 56]], "../fixtures/sub_bass.json" = [[9, 24], [41, 64]], "../fixtures/synth_pad.json" = [[1, 8], [25, 40], [49, 56]], "../fixtures/guitar_plugins.json" = [[1, 48]], "../fixtures/drum_rack.json" = [[9, 24], [41, 64]] }
locators = [{ name = "Intro", bar = 1 }, { name = "Verse", bar = 9 }, { name = "Build", bar = 25 }, { name = "Drop", bar = 41 }, { name = "Outro", bar = 57 }]
request = "what plays in the drop?"
why = "Five tracks play in the Drop (bars 41-56), but its section line names only the two that play throughout. A good answer reads the range with read_arrangement and names the rest too: the guitar (4-Audio) in its first half, the vocal from bar 45, the pad from bar 49."
expect_no_steps = true
expect_tools = ["read_arrangement"]
mention_any = ["Warm Pad", "4-Audio"]

[[case]]
id = "chat-scene-read"
chat_only = true
session = ["../fixtures/lead_vocal.json", "../fixtures/sub_bass.json", "../fixtures/synth_pad.json", "../fixtures/guitar_plugins.json", "../fixtures/drum_group.json", "../fixtures/drum_rack.json"]
fixture = "../fixtures/lead_vocal.json"
scenes = { "../fixtures/lead_vocal.json" = [2, 3], "../fixtures/sub_bass.json" = [2, 3, 4], "../fixtures/synth_pad.json" = [1, 3, 4], "../fixtures/guitar_plugins.json" = [1, 3], "../fixtures/drum_rack.json" = [2, 3, 4] }
scene_names = ["Intro", "Verse", "Drop", "Break"]
request = "which clips would I launch with the Drop scene?"
why = "The Drop scene has five clips, but its line in the Session view part names four and says \"and 1 more\". A good answer reads the scene with read_scenes and lists all five, the Beat included."
expect_no_steps = true
expect_tools = ["read_scenes"]
mention_any = ["Beat"]
